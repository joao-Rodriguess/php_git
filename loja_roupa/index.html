        <!-- Preço total -->
        <fieldset class="form-section">
            <legend>Resumo do Pedido</legend>
            <div class="form-group">
                <label for="precoTotal"><i class="bi bi-cash-stack"></i> Preço Total:</label><br>
                <input type="text" id="precoTotal" name="precoTotal" readonly style="background:#e3eafc; font-weight:700;">
            </div>
        </fieldset>

        <script>
// IDs dos campos de preço individuais
const camposPreco = [
    "precoCamiseta",
    "precoCalca",
    "precoCalcado",
    "precoShort"
];

// Adicione inputs de preço para cada peça
function criarCamposPreco() {
    const form = document.querySelector('form');
    const refs = [
        {id: "precoCamiseta", label: "Preço Camiseta"},
        {id: "precoCalca", label: "Preço Calça"},
        {id: "precoCalcado", label: "Preço Calçado"},
        {id: "precoShort", label: "Preço Short"}
    ];
    refs.forEach(ref => {
        const div = document.createElement('div');
        div.className = "form-group";
        div.innerHTML = `<label for="${ref.id}"><i class="bi bi-cash-coin"></i> ${ref.label}:</label><br>
            <input type="number" min="0" step="0.01" id="${ref.id}" name="${ref.id}" value="0" required><br>`;
        // Insere antes do campo cor
        const corDiv = document.getElementById('cor').parentNode;
        
    });
}
criarCamposPreco();

// Função para somar os preços
function atualizarPrecoTotal() {
    let total = 0;
    camposPreco.forEach(id => {
        const campo = document.getElementById(id);
        if (campo && campo.value) {
            total += parseFloat(campo.value) || 0;
        }
    });
    document.getElementById('precoTotal').value = "R$ " + total.toFixed(2).replace('.', ',');
}

// Adiciona evento para cada campo de preço
camposPreco.forEach(id => {
    document.addEventListener('input', function(e) {
        if (e.target.id === id) {
            atualizarPrecoTotal();
        }
    });
});

// Inicializa o valor total
atualizarPrecoTotal();
</script>

                <input type="file" id="arquivo" name="arquivo" required><br><br>
            </div>
        </fieldset>

        <div class="submit">
            <input type="submit" value="Cadastrar">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
